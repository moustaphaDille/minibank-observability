server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:h2:mem:transactiondb
  h2:
    console:
      enabled: true

services:
  account:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}