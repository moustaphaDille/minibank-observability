global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['customer-service:8081']
        labels:
          application: customer-service
          owner: equipe-clients
      - targets: ['account-service:8082']
        labels:
          application: account-service
          owner: equipe-paiements
      - targets: ['transaction-service:8083']
        labels:
          application: transaction-service
          owner: equipe-paiements
      - targets: ['health-hub:8090']
        labels:
          application: health-hub
          owner: equipe-plateforme