apiVersion: 1

groups:
  - orgId: 1
    name: services
    folder: MiniBank
    interval: 1m
    rules:
      - uid: service-up-or-down
        title: Service-up-or-down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="spring-apps"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.application }} est DOWN"
          description: "Le service {{ $labels.application }} ne répond plus depuis plus d'une minute."
        labels:
          severity: critical
        notification_settings:
          receiver: email-perso