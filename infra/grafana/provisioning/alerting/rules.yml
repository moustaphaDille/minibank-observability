apiVersion: 1

groups:
  - orgId: 1
    name: services-critical
    folder: MiniBank
    interval: 30s
    rules:
      - uid: service-up-or-down
        title: Service-up-or-down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="spring-apps"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30s
        annotations:
          summary: "{{ $labels.application }} est DOWN"
          description: "Le service {{ $labels.application }} (responsable : {{ $labels.owner }}) ne répond plus depuis plus de 30 secondes."
        labels:
          severity: critical

      - uid: compensation-failed
        title: Compensation-echouee
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (application, owner) (increase(minibank_compensation_failures_total[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "{{ $labels.application }} : compensation échouée"
          description: "Un compte a été débité sans que la cible soit créditée, et le remboursement a échoué aussi. Vérifier les transactions et rembourser manuellement. Responsable : {{ $labels.owner }}."
        labels:
          severity: critical

  - orgId: 1
    name: services-quality
    folder: MiniBank
    interval: 1m
    rules:
      - uid: high-5xx-rate
        title: Taux-erreurs-5xx-eleve
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (application, owner) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[2m])) / sum by (application, owner) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[2m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "{{ $labels.application }} : plus de 5 % d'erreurs serveur"
          description: "Le service {{ $labels.application }} (responsable : {{ $labels.owner }}) renvoie plus de 5 % d'erreurs 5xx depuis 2 minutes."
        labels:
          severity: warning