apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "\\[\\s*([0-9a-f]{32})-[0-9a-f]{16}\\s*\\]"
          url: "$${__value.raw}"
          datasourceUid: tempo